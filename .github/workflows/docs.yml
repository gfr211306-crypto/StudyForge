name: Docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readme:
    name: Validate README examples
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install StudyForge
        run: python -m pip install .

      - name: Validate documented examples
        uses: gfr211306-crypto/docs-that-run@v0.1.3
        with:
          files: README.md
          python-version: "3.12"
